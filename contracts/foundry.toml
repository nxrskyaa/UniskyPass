[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
extra_output = ["metadata"]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[rpc_endpoints]
monad = "https://rpc.monad.xyz"
monad_testnet = "https://testnet-rpc.monad.xyz"
